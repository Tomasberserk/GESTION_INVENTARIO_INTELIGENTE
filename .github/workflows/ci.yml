name: CI Pipeline — Monolith Governance & QA

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  backend-and-governance:
    name: Lint, Boundary Check & Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_neiva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_neiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 1 — Static Lint (ruff)
        run: |
          ruff check app

      - name: Stage 2 — Syntax & Compile Check
        run: |
          python -m compileall -q app tests

      - name: Stage 3 — Module Boundary Enforcement (import-linter)
        run: |
          lint-imports

      - name: Stage 4 — PostgreSQL Migrations (Alembic 001..013)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gestion_neiva_test"
        run: |
          alembic upgrade head
          alembic current

      - name: Stage 5 — Backend Test Suite & Coverage Report
        env:
          DATABASE_URL: "sqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/gestion_neiva_test"
          SECRET_KEY: "ci-test-secret-key-not-for-production-use-only"
          SUPERADMIN_KEY: "ci-superadmin-test-key"
        run: |
          pytest tests/ -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Backend Coverage Artifact (coverage.xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Stage 6 — End-to-End Business Journey Simulation (SQLite)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-not-for-production-use-only"
          SUPERADMIN_KEY: "ci-superadmin-test-key"
        run: |
          python run_e2e_simulation.py

  frontend-verify:
    name: Frontend Voice FSM Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Voice Turn Manager FSM Tests
        run: npm run test:voice

      - name: Build production SPA bundle
        run: npm run build
